aid: cookunity
name: Cookunity
description: CookUnity is the first chef-to-consumer meal marketplace, connecting award-winning
  chefs with food lovers nationwide. Chefs craft restaurant-quality meals in local kitchens
  and deliver them fresh, ready to heat in two minutes, with more than 300 rotating dishes
  spanning a wide range of cuisines and dietary options (keto, vegan, paleo, high-protein,
  gluten-free and more). Subscribers choose four to sixteen meals per week on a flexible
  weekly plan. The company also runs a chef marketplace onboarding culinary entrepreneurs,
  a CookUnity for Business program for corporate, healthcare and education clients, and
  gift cards. CookUnity is a consumer brand and does not publish a public developer API;
  this profile tracks its public web, identity, and domain-security surface. It was surfaced
  as a portfolio company of General Catalyst and Insight Partners.
